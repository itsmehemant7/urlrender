[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlrender"
version = "0.1.1"
description = "A lightweight Python library for rendering JavaScript-enabled web pages using Playwright"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Hemant Malik" },
]
keywords = [
    "playwright",
    "chromium",
    "web-rendering",
    "javascript",
    "html",
    "web-scraping",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.45.0,<1.49.0",
]

[project.urls]
Homepage = "https://github.com/itsmehemant7/urlrender"
Repository = "https://github.com/itsmehemant7/urlrender"
Issues = "https://github.com/itsmehemant7/urlrender/issues"

[tool.setuptools.packages.find]
where = ["src"]
